[project]
name = "apexstrategy"
version = "0.1.0"
description = "F1 race decision intelligence: predictive models, probabilistic simulation, and strategy evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    # Data
    "fastf1>=3.4,<3.6",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=15",
    # Contracts
    "pydantic>=2.6,<3",
    # Modelling
    "scikit-learn>=1.4,<2",
    "lightgbm>=4.3,<5",
    "statsmodels>=0.14,<1",
    "joblib>=1.3",
    # App
    "streamlit>=1.32,<2",
    "plotly>=5.20,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apexstrategy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: hits the network or takes >5s (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# Scoped deliberately: the simulator and strategy layers carry the correctness burden.
files = ["src/apexstrategy/sim", "src/apexstrategy/strategy"]
python_version = "3.11"
ignore_missing_imports = true
